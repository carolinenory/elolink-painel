<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ELOLINK · Social Media Command Center</title>
<style>
  :root {
    --brand: #5b2ad6;
    --brand-dark: #1c1c26;
    --bg: #f7f7fa;
    --card: #ffffff;
    --line: #eeeef2;
    --ink: #1c1c26;
    --ink-soft: #6b6b76;
    --ink-faint: #9a9aa5;
  }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor:pointer; }
  input, select, textarea { font: inherit; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#d9d9e3; border-radius:8px; }
  .fade-in { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .pop-in { animation: popIn .16s ease; }
  @keyframes popIn { from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }

  .grad-1 { background: linear-gradient(135deg,#ffb199,#ff0844); }
  .grad-2 { background: linear-gradient(135deg,#8fd3f4,#84fab0); }
  .grad-3 { background: linear-gradient(135deg,#fbc2eb,#a6c1ee); }
  .grad-4 { background: linear-gradient(135deg,#f6d365,#fda085); }
  .grad-5 { background: linear-gradient(135deg,#a1c4fd,#c2e9fb); }
  .grad-6 { background: linear-gradient(135deg,#d4fc79,#96e6a1); }
  .grad-7 { background: linear-gradient(135deg,#fddb92,#d1fdff); }
  .grad-8 { background: linear-gradient(135deg,#e0c3fc,#8ec5fc); }
  .grad-9 { background: linear-gradient(135deg,#f9d423,#ff4e50); }
  .logo-grad { background: linear-gradient(135deg,#5b2ad6,#ff5f7e 55%,#ffb199); }
  .ring-story { background: conic-gradient(from 45deg,#ff5f7e,#a259ff,#5b2ad6,#ff5f7e); }

  /* layout */
  .app-shell { min-height:100vh; display:flex; }
  .sidebar { width:256px; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; flex-shrink:0; z-index:30; }
  .sidebar-head { padding:20px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); }
  .sidebar-nav { flex:1; padding:12px; overflow-y:auto; }
  .nav-item { width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:none; background:none; text-align:left; font-size:14px; font-weight:500; color:var(--ink-soft); margin-bottom:2px; }
  .nav-item:hover { background:#f5f5f8; }
  .nav-item.active { background:rgba(91,42,214,0.1); color:var(--brand); }
  .sidebar-foot { padding:16px; border-top:1px solid var(--line); }
  .btn-dark-block { width:100%; text-align:center; padding:10px; border-radius:12px; background:var(--brand-dark); color:#fff; border:none; font-weight:600; font-size:14px; }
  .main { flex:1; min-width:0; }
  .main-inner { padding:32px; max-width:1080px; margin:0 auto; }
  @media (max-width: 900px) {
    .sidebar { position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s; }
    .sidebar.open { transform:translateX(0); }
    .main-inner { padding:16px; }
    .mobile-topbar { display:flex; }
  }
  .mobile-topbar { display:none; position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; align-items:center; justify-content:space-between; }
  .nav-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:25; display:none; }
  .nav-overlay.open { display:block; }

  /* atoms */
  .avatar { border-radius:999px; padding:3px; flex-shrink:0; }
  .avatar.ring { background: conic-gradient(from 45deg,#ff5f7e,#a259ff,#5b2ad6,#ff5f7e); }
  .avatar.plain { background:#e5e5ea; }
  .avatar-inner { width:100%; height:100%; border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; border:1px solid; font-weight:600; padding:5px 10px; font-size:12px; white-space:nowrap; }
  .badge.sm { font-size:11px; padding:3px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .thumb { position:relative; aspect-ratio:1/1; cursor:pointer; overflow:hidden; border-radius:8px; }
  .thumb .overlay { position:absolute; inset:0; background:rgba(0,0,0,0); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; opacity:0; transition:all .15s; text-align:center; padding:6px; }
  .thumb:hover .overlay { background:rgba(0,0,0,.55); opacity:1; }
  .thumb .overlay span { color:#fff; font-size:11px; }
  .thumb .status-emoji { position:absolute; top:6px; right:6px; font-size:13px; }
  .btn { border:none; border-radius:10px; font-weight:600; padding:9px 16px; font-size:14px; }
  .btn-primary { background:var(--brand); color:#fff; }
  .btn-dark { background:var(--brand-dark); color:#fff; }
  .btn-ghost { background:#f2f2f5; color:#3a3a44; }
  .btn-emerald { background:#10b981; color:#fff; }
  .btn-amber { background:#fbbf24; color:#fff; }
  .btn-rose { background:#f43f5e; color:#fff; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .field-label { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; margin-bottom:3px; }
  .field-value { font-size:14px; color:#3a3a44; line-height:1.4; white-space:pre-line; }
  .field-value.muted { color:var(--ink-faint); font-style:italic; }
  input.plain-input, select.plain-input, textarea.plain-input { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; }
  textarea.plain-input { resize:vertical; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-box { background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-width:520px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-box.wide { max-width:920px; }
  .modal-head { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .modal-body { overflow-y:auto; }
  .modal-close { border:none; background:none; font-size:20px; color:var(--ink-faint); cursor:pointer; padding:4px 8px; }
  .two-col { display:grid; grid-template-columns:1fr; }
  @media (min-width: 700px) { .two-col { grid-template-columns:1fr 1fr; } .two-col .col-left { border-right:1px solid var(--line); } }
  .toast-host { position:fixed; bottom:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .toast { background:var(--brand-dark); color:#fff; font-size:14px; padding:10px 16px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; gap:8px; align-items:center; }
  .tabs-row { display:flex; gap:8px; }
  .tab-btn { flex:1; padding:9px; border-radius:10px; font-size:14px; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--ink-soft); }
  .tab-btn.active { background:var(--brand-dark); color:#fff; border-color:var(--brand-dark); }
  .opt-card { border-radius:14px; border:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:12px; }
  .opt-card.selected { border-color:var(--brand); background:rgba(91,42,214,.05); }
  .comment-bubble { max-width:85%; border-radius:16px; padding:10px 14px; font-size:14px; }
  .comment-bubble.client { background:#f2f2f5; color:#3a3a44; }
  .comment-bubble.admin { background:rgba(91,42,214,.1); color:#3d1f96; margin-left:auto; }
  .kpi-card { border-radius:16px; border:1px solid var(--line); padding:16px; background:linear-gradient(#fafafd, #fff); }
  .hl-circle { width:64px; height:64px; border-radius:999px; padding:2px; border:1px solid var(--line); }
  .hl-circle-inner { width:100%; height:100%; border-radius:999px; }
  .cal-cell { min-height:74px; border-radius:10px; border:1px solid var(--line); padding:6px; text-align:left; }
  .cal-chip { margin-top:4px; font-size:10px; padding:4px 6px; border-radius:6px; background:#f5f5f8; cursor:pointer; line-height:1.3; }
  .cal-chip:hover { background:#ececf1; }
  .pill-tab { padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; border:none; background:none; color:var(--ink-soft); text-transform:capitalize; }
  .pill-tab.active { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.1); color:var(--ink); }
  .text-muted { color: var(--ink-faint); }
  .row-hover:hover { background:#fafafa; }
  a { color: inherit; }
  code { background:#f2f2f5; border-radius:5px; padding:1px 6px; font-family:ui-monospace, "SF Mono", Consolas, monospace; font-size:12px; }
</style>
</head>

function esc(s){ if (s===undefined||s===null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br/>"); }
function fmtDate(iso){ var p = iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function fmtDateShort(iso){
  var meses = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  var p = iso.split("-");
  return { day:p[2], month: meses[parseInt(p[1],10)-1] };
}
function daysAgo(iso){
  var d1 = new Date(iso+"T00:00:00");
  var d2 = new Date("2026-08-13T00:00:00");

}

function fallbackCopy(text){
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function copyTextToClipboard(text, successMsg){
  function onOk(){ pushToast(successMsg,"📋"); }
  function onFail(){ pushToast("Não copiou automaticamente — selecione o texto e copie manualmente.","⚠️"); }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(text).then(onOk, function(){ fallbackCopy(text) ? onOk() : onFail(); });
  } else {
    fallbackCopy(text) ? onOk() : onFail();
  }
}

    var blob = new Blob([html], { type:"text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "portal-cliente-elolink.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    pushToast("Arquivo do portal baixado!","⬇️");
  } catch(e){
    pushToast("Não foi possível gerar o arquivo neste navegador.","⚠️");

function adminEnsureProjeto(){
  return adminEnsureSenha().then(function(senha){
    if (!senha) return Promise.reject("sem_senha");
    if (ADMIN_SHARE.projetoId) return ADMIN_SHARE.projetoId;
    return sbRpc("admin_listar_projetos", { p_senha: senha }).then(function(res){
      if (!res.ok) return Promise.reject(res.data);
      var lista = res.data || [];
      if (lista.length > 0){
        ADMIN_SHARE.projetoId = lista[0].id;
        try { localStorage.setItem("elolink_projeto_id", ADMIN_SHARE.projetoId); } catch(e){}
        return ADMIN_SHARE.projetoId;
      }
      return sbRpc("admin_salvar_projeto", { p_senha: senha, p_id: null, p_nome: STATE.client.name, p_cliente_nome: STATE.client.name }).then(function(res2){
        if (!res2.ok) return Promise.reject(res2.data);
        ADMIN_SHARE.projetoId = res2.data.id;
        try { localStorage.setItem("elolink_projeto_id", ADMIN_SHARE.projetoId); } catch(e){}
        return ADMIN_SHARE.projetoId;
      });
    });
  });
}
function adminSyncContents(projetoId, senha){
  return sbRpc("admin_listar_conteudos", { p_senha: senha, p_projeto_id: projetoId }).then(function(res){
    if (!res.ok) return Promise.reject(res.data);
    if ((res.data||[]).length > 0) return res.data;
    var tasks = STATE.contents.map(function(c){
      var opt = (c.options && c.options[0]) || {};
      return sbRpc("admin_salvar_conteudo", {
        p_senha: senha, p_id: null, p_projeto_id: projetoId,
        p_titulo: c.title, p_formato: c.format, p_pilar: c.pillar, p_objetivo: c.objective,
        p_data_publicacao: c.date, p_status: c.status, p_capa: c.cover, p_legenda: c.caption,
        p_cta: c.cta, p_hashtags: c.hashtags,
        p_roteiro_hook: opt.hook, p_roteiro_desenvolvimento: opt.development, p_roteiro_cta: opt.cta,
        p_direcao_visual: opt.visual_direction, p_texto_tela: opt.on_screen_text, p_observacoes: opt.notes
      });
    });
    return Promise.all(tasks);
  });
}

var ONLINE = {
  token: null,
  senha: null,
  carregando: false,
  erro: null,
  projeto: null,
  conteudos: [],
  shareLinkId: null,
  activeId: null,
  confirmApprove: false,
  showChangeForm: false,
  showRejectForm: false,
};
function onlineTryAutoLogin(){
  var token = getUrlToken();
  if (!token) return;
  ONLINE.token = token;
  STATE.mode = "cliente-online";
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("elolink_cliente_sessao_"+token) || "null"); } catch(e){}
  if (saved && saved.senha){
    onlineLogin(token, saved.senha, true);
  } else {
    render();
  }
}
function onlineLogin(token, senha, silencioso){
  ONLINE.carregando = true; ONLINE.erro = null;
  if (!silencioso) render();
  sbRpc("cliente_validar_acesso", { p_token: token, p_senha: senha }).then(function(res){
    ONLINE.carregando = false;
    if (res.data && res.data.ok){
      ONLINE.token = token; ONLINE.senha = senha;
      ONLINE.projeto = res.data.projeto;
      ONLINE.conteudos = res.data.conteudos || [];
      ONLINE.shareLinkId = res.data.share_link_id;
      ONLINE.erro = null;
      try { localStorage.setItem("elolink_cliente_sessao_"+token, JSON.stringify({ senha: senha })); } catch(e){}
    } else {
      var codigo = res.data && res.data.erro;
      if (codigo === "bloqueado") ONLINE.erro = "Muitas tentativas com senha errada. Tente novamente em alguns minutos.";
      else if (codigo === "senha_incorreta") ONLINE.erro = "Senha incorreta.";
      else if (codigo === "link_invalido") ONLINE.erro = "Este link não é válido ou foi desativado.";
      else ONLINE.erro = "Não foi possível acessar agora. Tente novamente.";
      if (silencioso){ try { localStorage.removeItem("elolink_cliente_sessao_"+token); } catch(e){} }
    }
    render();
  }).catch(function(){
    ONLINE.carregando = false;
    ONLINE.erro = "Erro de conexão. Verifique sua internet e tente novamente.";
    render();
  });
}
function onlineSubmitPassword(){
  var el = document.getElementById("online-pw-input");

  onlineLogin(ONLINE.token, el.value, false);

  var active = ONLINE.activeId ? ONLINE.conteudos.find(function(c){ return c.id===ONLINE.activeId; }) : null;
  if (active){ html += onlinePostModalHtml(active); }

  html += '</div></div>';
  return html;
}

  html += '<div class="grad-1" style="width:100%;aspect-ratio:1/1;border-radius:14px;"></div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'+
    fieldHtml("Formato", c.formato)+fieldHtml("Data prevista", c.data_publicacao?fmtDate(c.data_publicacao):"-")+
    fieldHtml("Objetivo", c.objetivo)+fieldHtmlRaw("Status", statusBadgeHtml(c.status,"sm"))+'</div>';
  html += fieldHtml("Legenda", c.legenda);
  html += '</div>';
  html += '<div style="padding:22px;display:flex;flex-direction:column;gap:14px;">';
  html += '<p style="font-size:14px;color:var(--ink-soft);margin:0;">Este é o roteiro preparado para este conteúdo.</p>';

  html += fieldHtml("CTA", c.roteiro_cta);
  html += fieldHtml("Orientação visual", c.direcao_visual);
  html += fieldHtml("Texto na tela", c.texto_tela);
  if (!alreadyDecided){
    html += '<div style="padding-top:10px;border-top:1px solid var(--line);"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">'+
      '<button class="btn btn-emerald" onclick="onlineOpenApprove()">✓ Aprovar</button>'+
      '<button class="btn btn-amber" onclick="onlineOpenChangeForm()">↻ Alterar</button>'+
      '<button class="btn btn-rose" onclick="onlineOpenRejectForm()">✕ Reprovar</button></div></div>';

    html += '<div style="padding-top:10px;border-top:1px solid var(--line);">'+statusBadgeHtml(c.status)+'</div>';

      '<div style="font-size:32px;">✅</div><h4 style="margin:0;font-size:17px;font-weight:800;">Você deseja aprovar este conteúdo?</h4>'+
      '<div style="display:flex;gap:8px;"><button class="btn btn-ghost" onclick="onlineCancelApprove()">Cancelar</button><button class="btn btn-emerald" onclick="onlineConfirmApprove('+JSON.stringify(c.id)+')">Confirmar aprovação</button></div>'+
    '</div></div></div>';
  }
  if (ONLINE.showChangeForm){
    html += '<div class="modal-overlay"><div class="modal-box pop-in"><div style="padding:22px;display:flex;flex-direction:column;gap:10px;">'+
      '<h4 style="margin:0;font-size:16px;font-weight:800;">O que você gostaria que fosse alterado?</h4>'+
      '<textarea id="online-change-text" class="plain-input" rows="4" placeholder="Descreva a alteração desejada..." oninput="onlineCheckChangeText()"></textarea>'+
      '<div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn btn-ghost" onclick="onlineCancelChangeForm()">Cancelar</button>'+
      '<button id="online-change-submit-btn" class="btn btn-amber" disabled onclick="onlineSubmitChange('+JSON.stringify(c.id)+')">Enviar solicitação</button></div>'+
    '</div></div></div>';
  }
  if (ONLINE.showRejectForm){
    html += '<div class="modal-overlay"><div class="modal-box pop-in"><div style="padding:22px;display:flex;flex-direction:column;gap:10px;">'+
      '<h4 style="margin:0;font-size:16px;font-weight:800;">Tem certeza que deseja reprovar este conteúdo?</h4>'+
      '<textarea id="online-reject-text" class="plain-input" rows="3" placeholder="Conte o motivo da reprovação..." oninput="onlineCheckRejectText()"></textarea>'+
      '<div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn btn-ghost" onclick="onlineCancelRejectForm()">Cancelar</button>'+
      '<button id="online-reject-submit-btn" class="btn btn-rose" disabled onclick="onlineSubmitReject('+JSON.stringify(c.id)+')">Confirmar reprovação</button></div>'+
    '</div></div></div>';

  html += '</div>';
  return html;
}

  if (!alreadyDecided){
    html += '<div style="padding-top:10px;border-top:1px solid var(--line);"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">'+
      '<button class="btn btn-emerald" onclick="clientOpenApprove()">✓ Aprovar</button>'+

    '</div></div></div>';

  if (STATE.clientShowChangeForm){
    html += '<div class="modal-overlay"><div class="modal-box pop-in"><div style="padding:22px;display:flex;flex-direction:column;gap:10px;">'+
      '<h4 style="margin:0;font-size:16px;font-weight:800;">O que você gostaria que fosse alterado?</h4>'+
      '<textarea id="change-text" class="plain-input" rows="4" placeholder="Descreva a alteração desejada..." oninput="checkChangeText()"></textarea>'+
      '<div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn btn-ghost" onclick="clientCancelChangeForm()">Cancelar</button>'+

    '</div></div></div>';
  }
  if (STATE.clientShowRejectForm){
    html += '<div class="modal-overlay"><div class="modal-box pop-in"><div style="padding:22px;display:flex;flex-direction:column;gap:10px;">'+
